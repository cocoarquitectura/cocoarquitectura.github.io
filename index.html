<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COCO Arquitectura + Paisaje</title>
<meta name="description" content="Arquitectura, paisaje e interiorismo en Ixtapa Zihuatanejo, Querétaro y CDMX.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bone: #F2EFE8;
    --ink: #1A1A18;
    --forest: #1E2A21;
    --olive: #61662F;
    --muted: #6E6B62;
    --rule: rgba(26, 26, 24, 0.16);
  }

  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bone);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 22px 26px;
  }

  @media (min-width: 480px) {
    .card { min-height: auto; margin: 40px auto; box-shadow: 0 1px 40px rgba(26,26,24,0.07); padding: 40px 30px; }
  }

  .logo {
    width: 128px;
    height: auto;
    display: block;
  }

  .tagline {
    margin: 16px 0 0;
    font-size: 1.05rem;
    line-height: 1.3;
    font-weight: 300;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }

  .place {
    margin: 6px 0 0;
    font-size: 0.74rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .team {
    margin: 2px 0 0;
    font-size: 0.74rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .save {
    display: block;
    background: var(--olive);
    color: var(--bone);
    text-decoration: none;
    text-align: center;
    padding: 14px 18px;
    margin-top: 20px;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 400;
    border: none;
    width: 100%;
    cursor: pointer;
    font-family: 'Jost', sans-serif;
  }

  .save:active { background: #4E5226; }

  nav.actions { margin-top: 6px; }

  nav.actions a {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid var(--rule);
    color: var(--ink);
    text-decoration: none;
  }

  nav.actions a:last-child { border-bottom: none; }

  nav.actions a .label {
    font-size: 0.72rem;
    letter-spacing: 0.17em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  nav.actions a .value {
    font-size: 0.92rem;
    text-align: right;
    letter-spacing: 0.01em;
  }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--olive);
    outline-offset: 3px;
  }
</style>
</head>
<body>

<div class="card">

  <img class="logo" src="logo-coco.png" alt="COCO Arquitectura">
  <h1 class="tagline">Arquitectura que nace del lugar</h1>
  <p class="place">Ixtapa Zihuatanejo · Querétaro · CDMX</p>
  <p class="team">Daniela · Jorge · Valeria</p>

  <button class="save" id="save">Guardar contacto</button>

  <nav class="actions">
    <a href="https://wa.me/525532250263" target="_blank" rel="noopener">
      <span class="label">WhatsApp</span>
      <span class="value">+52 55 3225 0263</span>
    </a>
    <a href="mailto:contacto@cocoarquitectura.com">
      <span class="label">Correo</span>
      <span class="value">contacto@cocoarquitectura.com</span>
    </a>
    <a href="https://www.instagram.com/cocoarquitectura.mx/" target="_blank" rel="noopener">
      <span class="label">Instagram</span>
      <span class="value">@cocoarquitectura.mx</span>
    </a>
    <a href="https://pin.it/1XYJKhB" target="_blank" rel="noopener">
      <span class="label">Pinterest</span>
      <span class="value">Ver tablero</span>
    </a>
    <a href="https://www.cocoarquitectura.com" target="_blank" rel="noopener">
      <span class="label">Sitio</span>
      <span class="value">cocoarquitectura.com</span>
    </a>
  </nav>

</div>

<script>
  document.getElementById('save').addEventListener('click', function () {
    var vcard = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'FN:COCO Arquitectura',
      'ORG:COCO Arquitectura + Paisaje',
      'TEL;TYPE=CELL:+525532250263',
      'EMAIL:contacto@cocoarquitectura.com',
      'URL:https://www.cocoarquitectura.com',
      'ADR:;;;Ixtapa Zihuatanejo;;;México',
      'NOTE:Arquitectura\\, paisaje e interiorismo. Daniela\\, Jorge y Valeria.',
      'END:VCARD'
    ].join('\r\n');
    var blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'coco-arquitectura.vcf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });
</script>

</body>
</html>
